qemu_x64:
  active: true
  subdir: qemu/9.1/x64
  sources:
    - type: git
      url: ${QEMU.SOURCE.GITHUB.URL}
      branch: ${QEMU.SOURCE.GITHUB.BRANCH}
      depth: 1
      single_branch: true
      subdir: "."
  builders:
    - type: make.qemu
      subdirs:
        target: "."
        product: "."
        deploy: "."
      arch: "x86_64"
      compiler: "x86_64-linux-gnu-"
      jobs: 4
      params:
        config:
          - ""
          - "--target-list=aarch64-softmmu,x86_64-softmmu"
          - "--enable-tools"
          - "--enable-fdt"
          - "--enable-kvm"
          - "--enable-libusb"
          - "--enable-alsa"
          - "--audio-drv-list=alsa,oss,pa"
          - "--enable-blkio"
          - "--enable-virtfs"
          - "--enable-virtfs-proxy-helper"
          - "--enable-opengl"
          # - "--enable-virglrenderer"
          # - "--enable-gtk"
          # - "--enable-sdl"
          - "--enable-xen"
          # - "--disable-xen-pci-passthrough"
          # - "--enable-docs"
          - "--extra-cflags=\"-I%{components.xen_x64.deploy}/usr/local/include\""
          - "--extra-cflags=\"-Wno-error=unused-result\""
          - "--extra-cflags=\"-DXC_WANT_COMPAT_EVTCHN_API=1\""
          - "--extra-cflags=\"-DXC_WANT_COMPAT_GNTTAB_API=1\""
          - "--extra-cflags=\"-DXC_WANT_COMPAT_MAP_FOREIGN_API=1\""
          - "--extra-cflags=\"-DXC_WANT_COMPAT_DEVICEMODEL_API=1\""
          - "--extra-ldflags=\"-L%{components.xen_x64.deploy}/usr/local/lib\""
          - "--extra-ldflags=\"-Wl,-rpath,%{components.xen_x64.deploy}/usr/local/lib\""
        build:
          - ""
      targets:
        - ""
      env:
        - "PATH=/opt/glibc-2.40.9000/sbin:/opt/glibc-2.40.9000/bin:$PATH"
      artifacts:
        - "boot"
      deps:
        - ""

