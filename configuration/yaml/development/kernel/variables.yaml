KERNEL:
  MASTER: &KERNEL_MASTER_ALIAS
    RELEASE: "master"
    SOURCE:
      GITHUB:
        URL: "https://github.com/torvalds/linux.git"
        BRANCH: ${KERNEL.MASTER.RELEASE}
    CONFIG:
      ARM: vexpress_defconfig
      ARM64: defconfig
      X86: x86_64_defconfig
      X64: x86_64_defconfig

  v6_12: &KERNEL_6_12_ALIAS
    RELEASE: "v6.12"
    SOURCE:
      GITHUB:
        URL: "https://github.com/torvalds/linux.git"
        BRANCH: ${KERNEL.v6_12.RELEASE}
    CONFIG:
      ARM: vexpress_defconfig
      ARM64: defconfig
      X86: x86_64_defconfig
      X64: x86_64_defconfig

  DEFAULT: *KERNEL_6_12_ALIAS
